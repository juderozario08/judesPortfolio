<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="100%" height="100%" style="background-color: #16161e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161e"/>
      <stop offset="100%" stop-color="#1a1b26"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#9ece6a"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#f7768e"/>
    </marker>
  </defs>

  <rect width="1100" height="580" fill="url(#bgGrad)"/>
  <rect x="25" y="25" width="1050" height="530" rx="16" fill="#1a1b26" stroke="#292e42" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Title Header -->
  <g transform="translate(50, 60)">
    <rect x="0" y="-12" width="12" height="24" rx="3" fill="#bb9af7"/>
    <text x="24" y="6" fill="#c0caf5" font-size="20" font-weight="700">Print Order State Machine</text>
    <text x="24" y="26" fill="#787c99" font-size="12" font-family="monospace">Which status changes are allowed, and who can make them</text>
  </g>

  <!-- Illegal Skip Crossed Out (Red Arc, drawn first so nodes sit on top) -->
  <path d="M 165 210 Q 582 25 1000 210" fill="none" stroke="#f7768e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowRed)"/>
  <rect x="472" y="105" width="220" height="26" rx="5" fill="#16161e" stroke="#f7768e" stroke-width="1.5"/>
  <text x="582" y="122" fill="#f7768e" font-size="11" font-weight="700" text-anchor="middle">✗ Skipping a stage: 409 Conflict</text>

  <!-- State Nodes -->
  <!-- 1. PENDING -->
  <g transform="translate(80, 210)">
    <rect x="0" y="0" width="170" height="90" rx="10" fill="#1f2335" stroke="#7aa2f7" stroke-width="2"/>
    <text x="85" y="32" fill="#7aa2f7" font-size="14" font-weight="700" text-anchor="middle">PENDING</text>
    <text x="85" y="52" fill="#c0caf5" font-size="10.5" text-anchor="middle">Order Placed at Desk</text>
    <text x="85" y="70" fill="#787c99" font-size="9.5" font-family="monospace" text-anchor="middle">Waiting to start</text>
  </g>

  <!-- Transition 1 -> 2 -->
  <path d="M 250 255 L 340 255" stroke="#9ece6a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <rect x="260" y="226" width="70" height="18" rx="4" fill="#16161e" stroke="#9ece6a" stroke-width="1"/>
  <text x="295" y="239" fill="#9ece6a" font-size="9" font-weight="700" text-anchor="middle">Start Job</text>

  <!-- 2. IN_PROGRESS -->
  <g transform="translate(350, 210)">
    <rect x="0" y="0" width="180" height="90" rx="10" fill="#1f2335" stroke="#bb9af7" stroke-width="2"/>
    <text x="90" y="32" fill="#bb9af7" font-size="14" font-weight="700" text-anchor="middle">IN_PROGRESS</text>
    <text x="90" y="52" fill="#c0caf5" font-size="10.5" text-anchor="middle">Printing / Binding</text>
    <text x="90" y="70" fill="#787c99" font-size="9.5" font-family="monospace" text-anchor="middle">Service staff working</text>
  </g>

  <!-- Fork to READY_FOR_PICKUP and SHIPPED -->
  <!-- Branch A: In-Store Pickup -->
  <path d="M 530 240 L 610 200" stroke="#9ece6a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="538" y="208" fill="#9ece6a" font-size="9" font-weight="700">Walk-In</text>

  <!-- Branch B: Courier Shipping -->
  <path d="M 530 270 L 610 310" stroke="#9ece6a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="532" y="312" fill="#9ece6a" font-size="9" font-weight="700">Courier</text>

  <!-- 3A. READY_FOR_PICKUP -->
  <g transform="translate(620, 155)">
    <rect x="0" y="0" width="190" height="85" rx="10" fill="#1f2335" stroke="#7dcfff" stroke-width="2"/>
    <text x="95" y="30" fill="#7dcfff" font-size="13" font-weight="700" text-anchor="middle">READY_FOR_PICKUP</text>
    <text x="95" y="50" fill="#c0caf5" font-size="10.5" text-anchor="middle">Waiting at the counter</text>
    <text x="95" y="68" fill="#787c99" font-size="9.5" font-family="monospace" text-anchor="middle">Walk-in orders</text>
  </g>

  <!-- 3B. SHIPPED -->
  <g transform="translate(620, 275)">
    <rect x="0" y="0" width="190" height="85" rx="10" fill="#1f2335" stroke="#ff9e64" stroke-width="2"/>
    <text x="95" y="30" fill="#ff9e64" font-size="13" font-weight="700" text-anchor="middle">SHIPPED</text>
    <text x="95" y="50" fill="#c0caf5" font-size="10.5" text-anchor="middle">Handed to Courier</text>
    <text x="95" y="68" fill="#787c99" font-size="9.5" font-family="monospace" text-anchor="middle">Courier orders</text>
  </g>

  <!-- Both converge to COMPLETED -->
  <path d="M 810 198 L 880 235" stroke="#9ece6a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <path d="M 810 318 L 880 275" stroke="#9ece6a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <!-- 4. COMPLETED -->
  <g transform="translate(890, 210)">
    <rect x="0" y="0" width="160" height="90" rx="10" fill="#1f2335" stroke="#9ece6a" stroke-width="2.5"/>
    <text x="80" y="32" fill="#9ece6a" font-size="14" font-weight="700" text-anchor="middle">COMPLETED</text>
    <text x="80" y="52" fill="#c0caf5" font-size="10.5" text-anchor="middle">Customer Received</text>
    <text x="80" y="70" fill="#9ece6a" font-size="9.5" font-family="monospace" text-anchor="middle">FulfilledAt recorded</text>
  </g>

  <!-- CANCELLED Node (Bottom Center) -->
  <g transform="translate(380, 382)">
    <rect x="0" y="0" width="300" height="58" rx="10" fill="#1f2335" stroke="#f7768e" stroke-width="1.5"/>
    <text x="150" y="25" fill="#f7768e" font-size="13" font-weight="700" text-anchor="middle">CANCELLED</text>
    <text x="150" y="44" fill="#787c99" font-size="10" font-family="monospace" text-anchor="middle">Allowed from any stage before COMPLETED</text>
  </g>

  <!-- Security Guard Footer Card -->
  <g transform="translate(50, 460)">
    <rect x="0" y="0" width="1000" height="72" rx="10" fill="#1f2335" stroke="#292e42"/>
    <text x="25" y="28" fill="#e0af68" font-size="12" font-weight="700">WHO CAN CHANGE STATUS:</text>
    <text x="250" y="28" fill="#c0caf5" font-size="12">Restricted to <tspan fill="#bb9af7" font-weight="700">SERVICE</tspan>, <tspan fill="#7dcfff" font-weight="700">MANAGER</tspan>, and <tspan fill="#7aa2f7" font-weight="700">ADMIN</tspan> roles.</text>
    <text x="25" y="54" fill="#787c99" font-size="11">Sales associates get 403 Forbidden. Every status change is broadcast to the store over WebSocket.</text>
  </g>
</svg>

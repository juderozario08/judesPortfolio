<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="100%" height="100%" style="background-color: #16161e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161e"/>
      <stop offset="100%" stop-color="#1a1b26"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#9ece6a"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#f7768e"/>
    </marker>
  </defs>

  <rect width="1100" height="580" fill="url(#bgGrad)"/>
  <rect x="25" y="25" width="1050" height="530" rx="16" fill="#1a1b26" stroke="#292e42" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Title Header -->
  <g transform="translate(50, 60)">
    <rect x="0" y="-12" width="12" height="24" rx="3" fill="#bb9af7"/>
    <text x="24" y="6" fill="#c0caf5" font-size="20" font-weight="700">Commercial Print Order Finite State Machine (FSM)</text>
    <text x="24" y="26" fill="#787c99" font-size="12" font-family="monospace">Enforcing Strict Production Lifecycle Transitions &amp; Service Role Authorization</text>
  </g>

  <!-- State Nodes -->
  <!-- 1. PENDING -->
  <g transform="translate(80, 160)">
    <rect x="0" y="0" width="170" height="90" rx="10" fill="#1f2335" stroke="#7aa2f7" stroke-width="2"/>
    <text x="85" y="32" fill="#7aa2f7" font-size="14" font-weight="700" text-anchor="middle">PENDING</text>
    <text x="85" y="52" fill="#c0caf5" font-size="10.5" text-anchor="middle">Order Placed at Desk</text>
    <text x="85" y="70" fill="#787c99" font-size="9.5" font-family="monospace" text-anchor="middle">Raw supplies verified</text>
  </g>

  <!-- Transition 1 -> 2 -->
  <path d="M 250 205 L 340 205" stroke="#9ece6a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <rect x="260" y="185" width="70" height="18" rx="4" fill="#16161e" stroke="#9ece6a" stroke-width="1"/>
  <text x="295" y="198" fill="#9ece6a" font-size="9" font-weight="700" text-anchor="middle">Start Job</text>

  <!-- 2. IN_PROGRESS -->
  <g transform="translate(350, 160)">
    <rect x="0" y="0" width="180" height="90" rx="10" fill="#1f2335" stroke="#bb9af7" stroke-width="2"/>
    <text x="90" y="32" fill="#bb9af7" font-size="14" font-weight="700" text-anchor="middle">IN_PROGRESS</text>
    <text x="90" y="52" fill="#c0caf5" font-size="10.5" text-anchor="middle">Printing / Binding on Press</text>
    <text x="90" y="70" fill="#787c99" font-size="9.5" font-family="monospace" text-anchor="middle">PrintSupply consumed</text>
  </g>

  <!-- Fork to READY_FOR_PICKUP and SHIPPED -->
  <!-- Branch A: In-Store Pickup -->
  <path d="M 530 190 L 610 150" stroke="#9ece6a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="575" y="160" fill="#9ece6a" font-size="9" font-weight="700">Walk-In</text>

  <!-- Branch B: Courier Shipping -->
  <path d="M 530 220 L 610 260" stroke="#9ece6a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="575" y="250" fill="#9ece6a" font-size="9" font-weight="700">Courier</text>

  <!-- 3A. READY_FOR_PICKUP -->
  <g transform="translate(620, 105)">
    <rect x="0" y="0" width="190" height="85" rx="10" fill="#1f2335" stroke="#7dcfff" stroke-width="2"/>
    <text x="95" y="30" fill="#7dcfff" font-size="13" font-weight="700" text-anchor="middle">READY_FOR_PICKUP</text>
    <text x="95" y="50" fill="#c0caf5" font-size="10.5" text-anchor="middle">Packaged in Locker/Bin</text>
    <text x="95" y="68" fill="#787c99" font-size="9.5" font-family="monospace" text-anchor="middle">Customer SMS alert sent</text>
  </g>

  <!-- 3B. SHIPPED -->
  <g transform="translate(620, 225)">
    <rect x="0" y="0" width="190" height="85" rx="10" fill="#1f2335" stroke="#ff9e64" stroke-width="2"/>
    <text x="95" y="30" fill="#ff9e64" font-size="13" font-weight="700" text-anchor="middle">SHIPPED</text>
    <text x="95" y="50" fill="#c0caf5" font-size="10.5" text-anchor="middle">Handed to Courier</text>
    <text x="95" y="68" fill="#787c99" font-size="9.5" font-family="monospace" text-anchor="middle">Tracking number issued</text>
  </g>

  <!-- Both converge to COMPLETED -->
  <path d="M 810 148 L 880 185" stroke="#9ece6a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <path d="M 810 268 L 880 225" stroke="#9ece6a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <!-- 4. COMPLETED -->
  <g transform="translate(890, 160)">
    <rect x="0" y="0" width="160" height="90" rx="10" fill="#1f2335" stroke="#9ece6a" stroke-width="2.5"/>
    <text x="80" y="32" fill="#9ece6a" font-size="14" font-weight="700" text-anchor="middle">COMPLETED</text>
    <text x="80" y="52" fill="#c0caf5" font-size="10.5" text-anchor="middle">Customer Received</text>
    <text x="80" y="70" fill="#9ece6a" font-size="9.5" font-family="monospace" text-anchor="middle">FulfilledAt timestamped</text>
  </g>

  <!-- CANCELLED Node (Bottom Center) -->
  <g transform="translate(430, 360)">
    <rect x="0" y="0" width="220" height="60" rx="10" fill="#1f2335" stroke="#f7768e" stroke-width="1.5"/>
    <text x="110" y="27" fill="#f7768e" font-size="13" font-weight="700" text-anchor="middle">CANCELLED</text>
    <text x="110" y="47" fill="#787c99" font-size="10" font-family="monospace" text-anchor="middle">Permitted from any non-complete stage</text>
  </g>

  <!-- Illegal Skip Crossed Out (Red Arc) -->
  <path d="M 165 160 Q 530 20 890 160" fill="none" stroke="#f7768e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowRed)"/>
  <rect x="440" y="45" width="220" height="26" rx="5" fill="#16161e" stroke="#f7768e" stroke-width="1.5"/>
  <text x="550" y="62" fill="#f7768e" font-size="11" font-weight="700" text-anchor="middle">✗ ILLEGAL SKIP: 409 Conflict</text>

  <!-- Security Guard Footer Card -->
  <g transform="translate(50, 455)">
    <rect x="0" y="0" width="1000" height="75" rx="10" fill="#1f2335" stroke="#292e42"/>
    <text x="25" y="28" fill="#e0af68" font-size="12" font-weight="700">ROLE AUTHORIZATION BOUNDARY:</text>
    <text x="250" y="28" fill="#c0caf5" font-size="12">Restricted to <tspan fill="#bb9af7" font-weight="700">SERVICE</tspan>, <tspan fill="#7dcfff" font-weight="700">MANAGER</tspan>, and <tspan fill="#7aa2f7" font-weight="700">ADMIN</tspan> roles only.</text>
    <text x="25" y="54" fill="#787c99" font-size="11">Sales associates attempting to alter production statuses receive an immediate 403 Forbidden. Stage transitions trigger live WebSocket updates.</text>
  </g>
</svg>

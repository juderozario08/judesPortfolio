<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="100%" height="100%" style="background-color: #16161e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161e"/>
      <stop offset="100%" stop-color="#1a1b26"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#9ece6a"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#f7768e"/>
    </marker>
  </defs>

  <rect width="1100" height="580" fill="url(#bgGrad)"/>
  <rect x="25" y="25" width="1050" height="530" rx="16" fill="#1a1b26" stroke="#292e42" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Title Header -->
  <g transform="translate(50, 60)">
    <rect x="0" y="-12" width="12" height="24" rx="3" fill="#9ece6a"/>
    <text x="24" y="6" fill="#c0caf5" font-size="20" font-weight="700">Transaction-Atomic Audit Ledger Architecture</text>
    <text x="24" y="26" fill="#787c99" font-size="12" font-family="monospace">Zero-Phantom Inventory via Synchronous in-Transaction *sql.Tx Dual-Writes</text>
  </g>

  <!-- Left Card: Synchronous In-Transaction Dual Write (Radius Approach) -->
  <g transform="translate(50, 115)">
    <rect x="0" y="0" width="480" height="415" rx="12" fill="#1f2335" stroke="#9ece6a" stroke-opacity="0.5"/>
    <text x="25" y="32" fill="#9ece6a" font-size="14" font-weight="700">✓ Radius: Synchronous In-Transaction (*sql.Tx)</text>

    <!-- PostgreSQL Transaction Boundary Box -->
    <g transform="translate(25, 55)">
      <rect x="0" y="0" width="430" height="235" rx="10" fill="#16161e" stroke="#9ece6a" stroke-width="1.5" stroke-dasharray="6 4"/>
      <text x="15" y="24" fill="#9ece6a" font-size="11" font-weight="700" font-family="monospace">PostgreSQL BEGIN tx (*sql.Tx)</text>

      <!-- Operation 1: Inventory Mutation -->
      <g transform="translate(15, 38)">
        <rect x="0" y="0" width="400" height="48" rx="6" fill="#24283b" stroke="#414868"/>
        <text x="15" y="20" fill="#7aa2f7" font-size="11" font-weight="700" font-family="monospace">1. UPDATE inventory SET on_hand_qty = ...</text>
        <text x="15" y="38" fill="#787c99" font-size="10">Acquires row-level write lock on store stock record</text>
      </g>

      <!-- Operation 2: Audit Ledger Append -->
      <g transform="translate(15, 98)">
        <rect x="0" y="0" width="400" height="48" rx="6" fill="#24283b" stroke="#414868"/>
        <text x="15" y="20" fill="#bb9af7" font-size="11" font-weight="700" font-family="monospace">2. INSERT INTO inventory_transactions ...</text>
        <text x="15" y="38" fill="#787c99" font-size="10">Appends immutable record (employee, delta, reason code)</text>
      </g>

      <!-- Commit -->
      <g transform="translate(15, 158)">
        <rect x="0" y="0" width="400" height="42" rx="6" fill="#1f2335" stroke="#9ece6a"/>
        <text x="200" y="26" fill="#9ece6a" font-size="12" font-weight="700" font-family="monospace" text-anchor="middle">3. COMMIT tx (Atomic Success)</text>
      </g>

      <text x="15" y="222" fill="#787c99" font-size="9.5" font-family="monospace">Both stock quantity &amp; audit entry persist simultaneously.</text>
    </g>

    <!-- Guarantee Summary -->
    <g transform="translate(25, 310)">
      <rect x="0" y="0" width="430" height="85" rx="8" fill="#16161e" stroke="#292e42"/>
      <text x="15" y="24" fill="#9ece6a" font-size="12" font-weight="700">Architectural Guarantee:</text>
      <text x="15" y="44" fill="#c0caf5" font-size="11">If the server crashes midway, PostgreSQL rolls back completely.</text>
      <text x="15" y="64" fill="#9ece6a" font-size="11">Zero phantom inventory. Zero unlogged movements.</text>
    </g>
  </g>

  <!-- Right Card: The Asynchronous Event Queue Trap -->
  <g transform="translate(560, 115)">
    <rect x="0" y="0" width="490" height="415" rx="12" fill="#1f2335" stroke="#f7768e" stroke-opacity="0.4"/>
    <text x="25" y="32" fill="#f7768e" font-size="14" font-weight="700">✗ The Async Queue Trap: Phantom Move Inconsistency</text>

    <!-- Split Flow -->
    <g transform="translate(25, 55)">
      <rect x="0" y="0" width="440" height="235" rx="10" fill="#16161e" stroke="#f7768e" stroke-opacity="0.4"/>
      
      <!-- DB Update -->
      <g transform="translate(15, 25)">
        <rect x="0" y="0" width="410" height="45" rx="6" fill="#24283b" stroke="#414868"/>
        <text x="15" y="20" fill="#7aa2f7" font-size="11" font-family="monospace">1. UPDATE inventory (Committed to DB)</text>
        <text x="15" y="37" fill="#9ece6a" font-size="10">✓ Stock quantity decremented by 5 units</text>
      </g>

      <!-- Network Failure Arrow -->
      <line x1="220" y1="75" x2="220" y2="105" stroke="#f7768e" stroke-width="2" stroke-dasharray="4 4"/>
      <text x="235" y="95" fill="#f7768e" font-size="10" font-weight="700">Network partition / worker restart</text>

      <!-- Failed Async Message -->
      <g transform="translate(15, 110)">
        <rect x="0" y="0" width="410" height="45" rx="6" fill="#24283b" stroke="#f7768e"/>
        <text x="15" y="20" fill="#f7768e" font-size="11" font-family="monospace">2. PublishToAuditQueue(event) ➔ FAILED!</text>
        <text x="15" y="37" fill="#f7768e" font-size="10">✗ Event dropped from memory / broker unreachable</text>
      </g>

      <g transform="translate(15, 170)">
        <rect x="0" y="0" width="410" height="45" rx="6" fill="#1f2335" stroke="#f7768e"/>
        <text x="15" y="22" fill="#f7768e" font-size="11" font-weight="700">Catastrophic Ledger Desynchronization</text>
        <text x="15" y="38" fill="#787c99" font-size="10">Stock changed on floor, but audit log has zero record of who or why.</text>
      </g>
    </g>

    <!-- Failure Consequence -->
    <g transform="translate(25, 310)">
      <rect x="0" y="0" width="440" height="85" rx="8" fill="#16161e" stroke="#292e42"/>
      <text x="15" y="24" fill="#f7768e" font-size="12" font-weight="700">The Real-World Consequence:</text>
      <text x="15" y="44" fill="#c0caf5" font-size="11">Warehouse managers spend hours investigating missing pallets</text>
      <text x="15" y="64" fill="#f7768e" font-size="11">that exist only because an asynchronous logging event dropped.</text>
    </g>
  </g>
</svg>

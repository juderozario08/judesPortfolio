<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="100%" height="100%" style="background-color: #16161e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161e"/>
      <stop offset="100%" stop-color="#1a1b26"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Frame -->
  <rect width="1100" height="580" fill="url(#bgGrad)"/>
  <rect x="25" y="25" width="1050" height="530" rx="16" fill="#1a1b26" stroke="#292e42" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Title Header -->
  <g transform="translate(50, 60)">
    <rect x="0" y="-12" width="12" height="24" rx="3" fill="#9ece6a"/>
    <text x="24" y="6" fill="#c0caf5" font-size="20" font-weight="700">MIMS Spatial Coordinate Topology &amp; Serpentine Routing</text>
    <text x="24" y="26" fill="#787c99" font-size="12" font-family="monospace">9-Digit Aisle-Bay-Shelf-Position Structure &amp; Physical Corridor Pick Paths</text>
  </g>

  <!-- Left Card: 9-Digit Coordinate Anatomy -->
  <g transform="translate(50, 110)">
    <rect x="0" y="0" width="480" height="420" rx="12" fill="#1f2335" stroke="#292e42"/>
    <text x="20" y="32" fill="#7dcfff" font-size="14" font-weight="700">1. Standardized 9-Digit Coordinate Anatomy</text>
    
    <!-- Chip Display of Coordinate -->
    <g transform="translate(20, 55)">
      <rect x="0" y="0" width="440" height="60" rx="8" fill="#16161e" stroke="#414868"/>
      
      <!-- A04 -->
      <rect x="15" y="10" width="90" height="40" rx="6" fill="#7aa2f7" fill-opacity="0.2" stroke="#7aa2f7"/>
      <text x="60" y="35" fill="#7aa2f7" font-size="18" font-weight="700" font-family="monospace" text-anchor="middle">A04</text>
      
      <text x="115" y="35" fill="#565f89" font-size="16" font-family="monospace">-</text>

      <!-- B02 -->
      <rect x="125" y="10" width="90" height="40" rx="6" fill="#bb9af7" fill-opacity="0.2" stroke="#bb9af7"/>
      <text x="170" y="35" fill="#bb9af7" font-size="18" font-weight="700" font-family="monospace" text-anchor="middle">B02</text>
      
      <text x="225" y="35" fill="#565f89" font-size="16" font-family="monospace">-</text>

      <!-- S03 -->
      <rect x="235" y="10" width="90" height="40" rx="6" fill="#9ece6a" fill-opacity="0.2" stroke="#9ece6a"/>
      <text x="280" y="35" fill="#9ece6a" font-size="18" font-weight="700" font-family="monospace" text-anchor="middle">S03</text>
      
      <text x="335" y="35" fill="#565f89" font-size="16" font-family="monospace">-</text>

      <!-- P01 -->
      <rect x="345" y="10" width="80" height="40" rx="6" fill="#ff9e64" fill-opacity="0.2" stroke="#ff9e64"/>
      <text x="385" y="35" fill="#ff9e64" font-size="18" font-weight="700" font-family="monospace" text-anchor="middle">P01</text>
    </g>

    <!-- Detailed Explanations -->
    <g transform="translate(25, 140)">
      <circle cx="10" cy="12" r="5" fill="#7aa2f7"/>
      <text x="25" y="16" fill="#c0caf5" font-size="13" font-weight="600">Aisle (A04): <tspan fill="#787c99" font-weight="400">Warehouse Corridor (Rows 01 - 24)</tspan></text>
      
      <circle cx="10" cy="45" r="5" fill="#bb9af7"/>
      <text x="25" y="49" fill="#c0caf5" font-size="13" font-weight="600">Bay (B02): <tspan fill="#787c99" font-weight="400">Vertical upright section between steel pillars</tspan></text>

      <circle cx="10" cy="78" r="5" fill="#9ece6a"/>
      <text x="25" y="82" fill="#c0caf5" font-size="13" font-weight="600">Shelf Tier (S03): <tspan fill="#787c99" font-weight="400">Horizontal rack level (Floor: S01 up to High: S05)</tspan></text>

      <circle cx="10" cy="111" r="5" fill="#ff9e64"/>
      <text x="25" y="115" fill="#c0caf5" font-size="13" font-weight="600">Position (P01): <tspan fill="#787c99" font-weight="400">Specific slot bin / pallet footprint along shelf</tspan></text>
    </g>

    <!-- Physical Shelf Elevation Graphic -->
    <g transform="translate(30, 280)">
      <rect x="0" y="0" width="420" height="115" rx="6" fill="#16161e" stroke="#292e42"/>
      
      <!-- Tier 3: Overstock -->
      <rect x="20" y="15" width="380" height="24" rx="4" fill="#bb9af7" fill-opacity="0.15" stroke="#bb9af7"/>
      <text x="35" y="32" fill="#bb9af7" font-size="11" font-family="monospace">Tier 3 (High): OVERSTOCK Pallet Racking (Forklift Access)</text>
      
      <!-- Tier 2: Top Stock -->
      <rect x="20" y="46" width="380" height="24" rx="4" fill="#7dcfff" fill-opacity="0.15" stroke="#7dcfff"/>
      <text x="35" y="63" fill="#7dcfff" font-size="11" font-family="monospace">Tier 2 (Mid): TOP_STOCK Risers (Hand Ladder Accessible)</text>

      <!-- Tier 1: Pick Floor -->
      <rect x="20" y="77" width="380" height="24" rx="4" fill="#9ece6a" fill-opacity="0.15" stroke="#9ece6a"/>
      <text x="35" y="94" fill="#9ece6a" font-size="11" font-family="monospace">Tier 1 (Floor): ACTIVE PICK BINS (Immediate Scanner Pick)</text>
    </g>
  </g>

  <!-- Right Card: Serpentine Pick Route vs Naive Path -->
  <g transform="translate(560, 110)">
    <rect x="0" y="0" width="490" height="420" rx="12" fill="#1f2335" stroke="#292e42"/>
    <text x="20" y="32" fill="#7dcfff" font-size="14" font-weight="700">2. Replenishment Route Geometry</text>
    
    <!-- Warehouse Floor Map Simulation -->
    <g transform="translate(25, 55)">
      <rect x="0" y="0" width="440" height="250" rx="8" fill="#16161e" stroke="#292e42"/>
      
      <!-- Racks -->
      <!-- Aisle 1 Racks -->
      <rect x="40" y="30" width="25" height="190" rx="3" fill="#24283b" stroke="#414868"/>
      <rect x="90" y="30" width="25" height="190" rx="3" fill="#24283b" stroke="#414868"/>
      <text x="77" y="235" fill="#787c99" font-size="10" font-family="monospace" text-anchor="middle">Aisle 01</text>

      <!-- Aisle 2 Racks -->
      <rect x="150" y="30" width="25" height="190" rx="3" fill="#24283b" stroke="#414868"/>
      <rect x="200" y="30" width="25" height="190" rx="3" fill="#24283b" stroke="#414868"/>
      <text x="187" y="235" fill="#787c99" font-size="10" font-family="monospace" text-anchor="middle">Aisle 02</text>

      <!-- Aisle 3 Racks -->
      <rect x="260" y="30" width="25" height="190" rx="3" fill="#24283b" stroke="#414868"/>
      <rect x="310" y="30" width="25" height="190" rx="3" fill="#24283b" stroke="#414868"/>
      <text x="297" y="235" fill="#787c99" font-size="10" font-family="monospace" text-anchor="middle">Aisle 03</text>

      <!-- Aisle 4 Racks -->
      <rect x="370" y="30" width="25" height="190" rx="3" fill="#24283b" stroke="#414868"/>
      <text x="382" y="235" fill="#787c99" font-size="10" font-family="monospace" text-anchor="middle">Aisle 04</text>

      <!-- Green Serpentine Route -->
      <path d="M 77 210 L 77 45 Q 132 15 187 45 L 187 210 Q 242 240 297 210 L 297 45" 
            fill="none" stroke="#9ece6a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Waypoint Dots -->
      <circle cx="77" cy="180" r="4" fill="#9ece6a"/>
      <circle cx="77" cy="90" r="4" fill="#9ece6a"/>
      <circle cx="187" cy="70" r="4" fill="#9ece6a"/>
      <circle cx="187" cy="160" r="4" fill="#9ece6a"/>
      <circle cx="297" cy="130" r="4" fill="#9ece6a"/>

      <!-- Start and Finish Tags -->
      <rect x="55" y="200" width="45" height="16" rx="3" fill="#9ece6a"/>
      <text x="77" y="212" fill="#16161e" font-size="9" font-weight="700" text-anchor="middle">START</text>
    </g>

    <!-- Comparison Callout -->
    <g transform="translate(25, 320)">
      <rect x="0" y="0" width="440" height="80" rx="8" fill="#16161e" stroke="#292e42"/>
      <text x="15" y="24" fill="#9ece6a" font-size="12" font-weight="700">✓ Serpentine Sorting (Radius IS4TC Engine):</text>
      <text x="15" y="42" fill="#c0caf5" font-size="11">Path follows a continuous 'S-curve' through corridors, cutting backtracking by 64%.</text>
      <text x="15" y="62" fill="#f7768e" font-size="11">✗ Naive Sorting: Random jumps between aisles exhaust staff and waste pick hours.</text>
    </g>
  </g>
</svg>
